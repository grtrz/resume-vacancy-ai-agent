services:
  api:
    build:
      context: .
    container_name: resume-agent-api
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://resume_agent:resume_agent@postgres:5432/resume_agent
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: disabled
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: resume-agent-postgres
    environment:
      POSTGRES_DB: resume_agent
      POSTGRES_USER: resume_agent
      POSTGRES_PASSWORD: resume_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_agent -d resume_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: resume-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
