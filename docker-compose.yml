services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-agent-postgres
    environment:
      POSTGRES_DB: resume_agent
      POSTGRES_USER: resume_agent
      POSTGRES_PASSWORD: resume_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_agent -d resume_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: resume-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
